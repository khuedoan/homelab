apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-generator
  namespace: {{ .Release.Namespace }}
data:
{{ (.Files.Glob "files/secret-generator/*.go").AsConfig | indent 2 }}
{{ (.Files.Glob "files/secret-generator/go.*").AsConfig | indent 2 }}
  config.yaml: |
{{ toYaml .Values.secretDefinitions | indent 4 }}
