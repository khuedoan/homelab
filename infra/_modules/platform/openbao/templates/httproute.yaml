apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: https
  hostnames: [openbao.khuedoan.com]
  rules:
    - backendRefs:
        - name: openbao
          port: 8200
