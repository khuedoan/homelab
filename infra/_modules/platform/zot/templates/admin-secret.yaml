apiVersion: v1
kind: Secret
metadata:
  name: registry-admin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    homelab.khuedoan.com/bao-secret: "true"
  annotations:
    secrets-webhook.security.bank-vaults.io/provider: bao
    secrets-webhook.security.bank-vaults.io/bao-role: {{ .Release.Namespace }}
    secrets-webhook.security.bank-vaults.io/bao-path: kubernetes
    secrets-webhook.security.bank-vaults.io/bao-serviceaccount: default
data:
  username: {{ "admin" | b64enc | quote }}
  password: {{ "bao:secret/data/registry.admin#password" | b64enc | quote }}
