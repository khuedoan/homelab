controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/paperless-ngx/paperless-ngx
          tag: 3.3.1
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
              periodSeconds: 5
              failureThreshold: 60
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8000
        env:
          PAPERLESS_URL: 'https://paperless.{{ .Values.global.domain }}'
          PAPERLESS_REDIS: redis://localhost:6379
          PAPERLESS_ADMIN_USER: admin
          PAPERLESS_TIME_ZONE: Asia/Ho_Chi_Minh
          PAPERLESS_THREADS_PER_WORKER: 1
          PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
          PAPERLESS_DISABLE_REGULAR_LOGIN: 'true'
          PAPERLESS_REDIRECT_LOGIN_TO_SSO: 'true'
          PAPERLESS_SOCIAL_AUTO_SIGNUP: 'true'
        envFrom:
          - secretRef:
              identifier: credentials
      broker:
        image:
          repository: docker.io/valkey/valkey
          tag: 9.0.6-alpine
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 8000
        protocol: HTTP
route:
  main:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: istio-system
        sectionName: https
    hostnames:
      - 'paperless.{{ .Values.global.domain }}'
    rules:
      - backendRefs:
          - identifier: main
            port: 8000
persistence:
  data:
    suffix: data
    accessMode: ReadWriteOnce
    size: 10Gi
    advancedMounts:
      main:
        main:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
          - path: /usr/src/paperless/consume
            subPath: consume
        broker:
          - path: /data
            subPath: broker
secrets:
  credentials:
    labels:
      homelab.khuedoan.com/bao-secret: 'true'
    stringData:
      PAPERLESS_SECRET_KEY: bao:secret/data/paperless/admin#secret_key
      PAPERLESS_ADMIN_PASSWORD: bao:secret/data/paperless/admin#password
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
        {
          "openid_connect": {
            "OAUTH_PKCE_ENABLED": true,
            "APPS": [
              {
                "provider_id": "sso",
                "name": "SSO",
                "client_id": "${bao:secret/data/paperless/sso#client_id}",
                "secret": "${bao:secret/data/paperless/sso#client_secret}",
                "settings": {
                  "server_url": "https://auth.{{ .Values.global.domain }}/oauth2/openid/paperless",
                  "token_auth_method": "client_secret_basic"
                }
              }
            ]
          }
        }
